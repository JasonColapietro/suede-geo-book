name: Publish the public source edition

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the book
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install --yes pandoc

      - name: Test the source edition
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Audit files approved for publication
        run: python3 tools/audit_public_release.py

      - name: Build the site
        run: python3 pages/build.py --output _site --pandoc pandoc

      - name: Audit the public copy
        run: python3 tools/audit_public_copy.py _site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy the public source edition
        id: deployment
        uses: actions/deploy-pages@v5
